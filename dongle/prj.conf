# ---------------------------------------------------------------------------
# USB CDC-ACM, on the new (device_next) stack.
#
# The board's Kconfig.defconfig already defaults these on via
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig. They are stated
# explicitly so the intent survives an SDK or board bump.
#
# INITIALIZE_AT_BOOT brings up the USB device stack and the single CDC-ACM
# instance before main() runs. It depends only on USBD_CDC_ACM_CLASS, not on
# CONSOLE, so it still works with the console detached below.
# ---------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---------------------------------------------------------------------------
# The protocol owns the CDC-ACM port exclusively. See PLAN.md §1.4.
#
# The board's common devicetree points zephyr,console AND zephyr,shell-uart
# AND zephyr,uart-mcumgr AND both bt-*-uart chosen nodes at the one CDC-ACM
# instance. If any of them stays live it interleaves bytes into the protocol
# stream: a log line over 120 bytes trips the receiver's discard-and-resync
# path, and a write landing mid-line corrupts that line. Both failures are
# silent and intermittent.
#
# Diagnostics leave the dongle as protocol `LOG`/`ERR` lines instead (§3),
# which the app already renders in its debug panel.
# ---------------------------------------------------------------------------
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_BOOT_BANNER=n

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Provisioning (Stage 2, BUILD_SPEC.md §9). A raw read of storage_partition —
# written once at manufacture by tools/provision.py, never through Zephyr's
# settings/NVS subsystem, so nothing beyond flash_area's read path is needed.
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ---------------------------------------------------------------------------
# BLE (Stage 3, BUILD_SPEC.md §7/§10). Only take effect when
# CONFIG_DONGLE_RADIO=y selects CONFIG_BT (Kconfig); harmless, unused lines
# under the CONFIG_DONGLE_RADIO=n baseline.
#
# No settings backend: RP §10.3 stores nothing to erase, migrate or corrupt —
# the LTK comes fresh from storage_partition every boot via
# bt_nrf_conn_set_ltk(), never through Zephyr's bonding/settings path.
# CONFIG_BT_BONDABLE=n is the compiled-in half of that; radio_ble.c's runtime
# bt_set_bondable(false) is the other, belt and braces, same reasoning as the
# GATT ENCRYPT permissions being a second lock on a door the LTK already
# bolts (RP §3.1).
# ---------------------------------------------------------------------------
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_BONDABLE=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="RefRemote Dongle"

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Provisioning — remote/BUILD_SPEC.md §9. Identical mechanism to the dongle
# (dongle/prj.conf's Stage 2 block): a raw read of storage_partition, never
# through Zephyr's settings/NVS subsystem.
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ---------------------------------------------------------------------------
# BLE — remote/BUILD_SPEC.md §5-§10. Peripheral, GATT server, one connection.
#
# No settings backend, same reasoning as the dongle: RP §10.3 stores nothing
# to erase, migrate or corrupt. The LTK comes fresh from storage_partition
# every boot via bt_nrf_conn_set_ltk(), never through Zephyr's bonding path.
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_NRF_CONN_SET_LTK=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="RefRemote"
CONFIG_BT_FILTER_ACCEPT_LIST=y

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# BLE — identical shape to remote/prj.conf: peripheral, GATT server, one
# connection. This board answers the same protocol from the same role
# (RED or GREEN, decided by provisioning, never by firmware) — PLAN.md §4.9's
# whole point is that remote #2 runs real remote firmware, not a simplified
# radio stand-in, so the BLE configuration is not simplified either.
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_NRF_CONN_SET_LTK=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="RefRemote"
CONFIG_BT_FILTER_ACCEPT_LIST=y

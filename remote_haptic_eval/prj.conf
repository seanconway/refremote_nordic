# ---------------------------------------------------------------------------
# DRV2605L over i2c1 -- same peripheral drv2605.c always used.
# ---------------------------------------------------------------------------
CONFIG_I2C=y
CONFIG_MAIN_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Interactive command console over the DK's on-board UART (J-Link VCOM),
# already the board's default console backend -- no CDC-ACM instance
# involved, so none of CLAUDE.md's dongle console/log trap applies to this
# app. `haptic cal`, `haptic play <id>`, `haptic seq <id...>`, `haptic list`.
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
